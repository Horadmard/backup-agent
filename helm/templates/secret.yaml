apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent.fullname" . }}-secret
  labels:
    {{- include "agent.labels" . | nindent 4 }}
type: Opaque

stringData:
  RUSTFS_ACCESS_KEY: {{ .Values.rustfs.accessKey | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.rustfs.secretKey | quote }}

  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}

  GPG_PASSPHRASE: {{ .Values.gpg.passphrase | quote }}

  SMTP_KEY: {{ .Values.smtp.key | quote }}
  SMTP_SECRET: {{ .Values.smtp.secret | quote }}