apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "agent.fullname" . }}-cronjob
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "agent.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
          - name: agent
            image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            command:
              - /bin/sh 
              - /app/entrypoint.sh
              - all
            env:
            # RustFS
            - name: RUSTFS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: RUSTFS_HOST
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: RUSTFS_SECRET_KEY
            # PostgreSQL
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: POSTGRES_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: POSTGRES_DB
            # GPG
            - name: GPG_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: GPG_PASSPHRASE
            # SMTP
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: SMTP_PORT
            - name: SMTP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: SMTP_KEY
            - name: SMTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.fullname" . }}-secret
                  key: SMTP_SECRET
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: SMTP_FROM
            - name: NOTIFICATION_TO
              valueFrom:
                configMapKeyRef:
                  name: {{ include "agent.fullname" . }}-config
                  key: NOTIFICATION_TO